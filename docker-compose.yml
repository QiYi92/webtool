services:
  dsa:
    build:
      context: ./dsa
      dockerfile: docker/Dockerfile
    container_name: galileocat-dsa
    restart: unless-stopped
    # 上游镜像默认运行 --schedule；嵌入式部署需要常驻 WebUI 供 /dsa 反向代理访问。
    command: ["python", "main.py", "--webui-only", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./dsa/.env
        required: false
    environment:
      DSA_DATABASE_URL: ${DSA_DATABASE_URL}
      DSA_SSO_SECRET: ${DSA_SSO_SECRET}
      DSA_SSO_ENABLED: "true"
      DSA_ROOT_PATH: /dsa
      DSA_COOKIE_SECURE: ${DSA_COOKIE_SECURE:-true}
      WEBUI_HOST: 0.0.0.0
      WEBUI_PORT: 8000
    volumes:
      - ./dsa/data:/app/data
      - ./dsa/logs:/app/logs
      - ./dsa/reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: galileocat-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CORS_ALLOW_ORIGINS: ${FRONTEND_PUBLIC_ORIGIN:-http://localhost:3000}
      STOCK_SCREEN_ROOT: /opt/stock_screen
    ports:
      - "8888:8888"
    volumes:
      - ./backend/logs:/app/logs
      # 策略源码随本仓库发布，容器内保持稳定的应用路径。
      - ./Stock_Screen:/opt/stock_screen:ro
    # 让容器可通过 host.docker.internal 访问宿主机代理。
    # 仅在 backend/.env 设置 BANGUMI_PROXY=http://host.docker.internal:<port> 时使用。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8888}
        DSA_INTERNAL_URL: http://dsa:8000
    container_name: galileocat-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      dsa:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - FRED_API_KEY=${FRED_API_KEY:-}
      - DSA_INTERNAL_URL=http://dsa:8000
